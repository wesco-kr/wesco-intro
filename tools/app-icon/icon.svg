<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">WESCO 앱 아이콘 C — 포근한 원</title>
  <desc id="desc">연한 살구색 바탕과 아이보리 원형 받침, 중앙의 레드 코뚜레 심볼.</desc>
  <defs>
    <filter id="brand-red" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#E1431B"/>
      <feComposite in2="SourceAlpha" operator="in"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="#FBEAE4"/>
  <circle cx="512" cy="512" r="384" fill="#FDFCF9"/>
  <image href="symbol_red.png" x="292.56" y="252" width="438.88" height="520" preserveAspectRatio="xMidYMid meet" filter="url(#brand-red)"/>
</svg>
